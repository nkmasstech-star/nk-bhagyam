name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
        env:
          BUILD_NUM: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: malabar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Malabar-test.apk
          echo "{\"build\": ${{ github.run_number }}, \"note\": \"$(git log -1 --pretty=%s | head -c 140 | sed 's/\"/'"'"'/g')\"}" > version.json
          cat version.json
          gh release delete test-apk -y --cleanup-tag || true
          gh release create test-apk Malabar-test.apk version.json --title "Test APK" --notes "Latest debug build" --prerelease
